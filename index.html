<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <div class="brand-banner">
            <img src="styles/images/odin-lined.png" alt="The Odin Project's Logo" id="brand-logo">
            <h1 class="brand-name">ODIN</h1>
        </div>
        <p class="credits">
            Photo by
            <a href="https://unsplash.com/@haliewestphoto">Halie West</a>
            on
            <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a>
        </p>
    </header>

    <main>
        <section class="message">
            <p>
                This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br> 
                Sign up now to get started.
            </p>
            <br>
            <p>You know you want to.</p>
        </section>

        <form action="post">

            <legend>Let's do this!</legend>

            <section class="input-section">
                
                <div class="input-container">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" required>
                </div>

                <div class="input-container">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" required>
                </div>

                <div class="input-container">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" required>
                </div>
                    
                <div class="input-container">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="tel" id="phone-number" required>
                </div>
                    
                <div class="input-container">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" required>
                </div>

                <div class="input-container">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" required>
                </div>
            </section>

            <section class="submit-section">
                <input type="submit" value="Create Account">
                <p>Already have an account? <a href="">Log In</a></p>
            </section>
        </form>
    </main>
</body>
</html>
